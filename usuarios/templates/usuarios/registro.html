{% extends "base.html" %}
{% load static %}
{% block title_text %}Registrarse{% endblock %}
{% block h1_text %}Registrarse{% endblock %}

{% block main %}
<div class="container d-flex justify-content-center align-items-center flex-wrap gap-5 mt-5">
  <form method="post" class="flex-grow-1" style="max-width: 500px; min-width: 300px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100">Registrarse</button>
  </form>
  <img src="{% static 'assets/img/register.png' %}" alt="Registro" class="img-fluid shadow rounded" style="max-width: 400px;">
</div>
{% endblock %}
