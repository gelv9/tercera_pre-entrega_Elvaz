{% extends "base.html" %}

{% block title_text %}Editar perfil{% endblock title_text %}
{% block h1_text %}Editar perfil{% endblock h1_text %}

{% block main %}
<form action="{% url 'usuarios:editar_perfil' %}" method="post" enctype='multipart/form-data'>
    {% csrf_token %}
    {{ formulario.as_p }}
    <input type="submit" value="Actualizar" class="btn btn-primary">
</form>
<p>
    <a href={% url "usuarios:cambiar_contraña" %}>Cambiar contraseña</a>
</p>
{% endblock main %}
